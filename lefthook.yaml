#   Refer for explanation to following link:
#   https://lefthook.dev/configuration
#
output:
  - summary
  - success
  - failure
  - execution

pre-commit:
  commands:
    lint commit codes:
      glob: '*.{js,ts}'
      run: pnpm eslint {staged_files} --fix
      stage_fixed: true
    type checking:
      run: pnpm typecheck

commit-msg:
  commands:
    lint commit message:
      run: pnpm commitlint --edit {1}
